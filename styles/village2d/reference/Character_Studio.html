<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Character Studio</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4ef;--card:#fff;--tx:#1d1b18;--mu:#6b665e;--ac:#5b5bd6;--bd:#e2ded6;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161a;--card:#222126;--tx:#f1eee8;--mu:#a29d94;--ac:#8b8bf0;--bd:#37353d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17161a;--card:#222126;--tx:#f1eee8;--mu:#a29d94;--ac:#8b8bf0;--bd:#37353d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{font-size:20px;margin:0 0 2px}.sub{color:var(--mu);margin:0 0 14px;font-size:13px}
.wrap{max-width:1050px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
textarea{width:100%;height:84px;resize:vertical;border:1px solid var(--bd);border-radius:10px;padding:10px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:9px;padding:7px 12px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:12px;padding:4px 9px;color:var(--mu)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin-top:10px}
label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:3px}
label.ck{flex-direction:row;align-items:center;gap:6px;color:var(--tx)}
select,input[type=color]{width:100%;height:32px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;padding:2px 6px}
input[type=color]{padding:2px}
.ol #all :is(path,rect,ellipse,circle):not(.nl){stroke:#2b1b1b;stroke-width:2.5;stroke-linejoin:round}
.ol #all .eye ellipse{stroke-width:1.5}
#stage{width:100%;max-width:min(100%,calc(78vh*.625));aspect-ratio:5/8;height:auto;margin:0 auto;border-radius:12px;display:block;transition:background .3s}
</style></head>
<body>
<div class="wrap">
<div>
<div class="card">
<h1>Character Studio</h1>
<p class="sub">Describe a Bangladeshi village character (girl, farmer, woman, boy…) and it’s drawn and animated entirely with code.</p>
<textarea id="desc">An old woman in an olive saree with her head covered and a yellow blouse, standing in a doorway</textarea>
<div class="row"><button class="p" id="go">Build character</button><button id="rnd">Random villager</button></div>
<div class="row" id="chips"></div>
</div>
<div class="card" style="margin-top:12px">
<div class="grid" id="ctl"></div>
</div>
</div>
<div class="card">
<div class="row" id="anims" style="margin-top:0"></div>
<svg id="stage" viewBox="50 10 300 480" xmlns="http://www.w3.org/2000/svg"></svg>
</div>
</div>
<script>
const C={red:'#e53935',blue:'#1e88e5',green:'#43a047',yellow:'#fdd835',purple:'#9a78bd',olive:'#6b7f2a',maroon:'#8e2b3a',magenta:'#c2185b',pink:'#f06292',orange:'#fb8c00',black:'#1b1b1b',white:'#f5f5f5',brown:'#6d4c41',blonde:'#f2c94c',gray:'#9e9e9e',grey:'#9e9e9e',teal:'#00897b',navy:'#1a237e',silver:'#cfd8dc',gold:'#fbc02d'};
const SK={light:'#e0ac80',fair:'#e0ac80',medium:'#c68a5a',tan:'#c68a5a',brown:'#a8693f',dark:'#7a4a2a'};
const SEL={scene:['village','bedroom','field','pond','night','room','door','plain'],age:['child','adult','elder'],style:['sleek','waist-length','short','bob','braids','ponytail','bun','bald'],outfit:['shirt','kameez','saree','lungi','fatua'],hat:['none','pallu','topi','tokai','gamchha'],expr:['happy','neutral','sad','crying','angry','surprised'],build:['slim','normal','chunky']};
const LBL={scene:'Scene',age:'Age',style:'Hair style',outfit:'Village outfit',hat:'Headwear',expr:'Expression',build:'Build'};
const COL={skin:'Skin',hair:'Hair color',shirt:'Saree & head cover color',pants:'Pants / saree border color',blouse:'Blouse color',bg:'Background'};
const CK={glasses:'Glasses',beard:'Beard',mustache:'Mustache',bindi:'Bindi',gamchha:'Gamchha (shoulder)',kolshi:'Kolshi (water pot)',toon:'Cartoon outline style',sandals:'Sandals',nosepin:'Nose pin',phone:'Smartphone',longbeard:'Long beard',necklace:'Necklace',earring:'Earrings',sleeping:'Sleeping on bed',sitting:'Sitting on chair',mat:'Sitting on mat'};
const ANIMS=['idle','wave','walk','dance','jump','talk'];
const DEF={skin:'#b57a4c',hair:'#1b1411',shirt:'#c94f4f',pants:'#2f6f8f',bg:'#e3ecd2',scene:'village',age:'adult',style:'sleek',outfit:'shirt',hat:'none',expr:'happy',build:'normal',glasses:false,beard:false,mustache:false,bindi:false,gamchha:false,kolshi:false,toon:true,sandals:true,nosepin:false,phone:false,longbeard:false,necklace:false,earring:false,sleeping:false,sitting:false,mat:false,blouse:'#e6b422'};
let S={...DEF,anim:'idle'};
const svg=document.getElementById('stage');
const dk=(h,a)=>{const n=parseInt(h.slice(1),16);return '#'+[n>>16,n>>8&255,n&255].map(v=>Math.round(v*(1-a)).toString(16).padStart(2,'0')).join('')};

const isMat=()=>S.mat&&!S.sleeping,isSit=()=>S.sitting&&!S.sleeping&&!S.mat,still=()=>isSit()||isMat();
function scene(){return sceneBase()+(isMat()?'<path d="M96 408H304L346 468H54Z" fill="#d2a94e"/><path d="M82 428H318M70 446H330M110 412L84 466M150 410L136 468M200 410V468M250 410L264 468M290 410L316 468" stroke="#a47c2c" stroke-width="3" fill="none"/><path d="M96 408H304L346 468H54Z" fill="none" stroke="#8a5f1c" stroke-width="5" stroke-linejoin="round" class="nl"/>':'')+(isSit()?'<g transform="translate(0 16)"><rect x="124" y="250" width="14" height="198" rx="4" fill="#7a4a24"/><rect x="262" y="250" width="14" height="198" rx="4" fill="#7a4a24"/><rect x="120" y="240" width="160" height="18" rx="6" fill="#5e3718"/><rect x="150" y="262" width="10" height="120" fill="#6b3f1f"/><rect x="240" y="262" width="10" height="120" fill="#6b3f1f"/><rect x="138" y="296" width="124" height="12" fill="#6b3f1f"/><rect x="116" y="400" width="168" height="12" rx="5" fill="#8a5a2c"/><rect x="124" y="412" width="152" height="5" fill="#6b3f1f"/></g>':'')}
function sceneBase(){
 if(S.scene==='door')return '<rect width="400" height="500" fill="#3a3a3f"/><rect x="70" y="90" width="260" height="330" fill="#e8a436" stroke="#2a2a2a" stroke-width="10"/><rect y="420" width="400" height="80" fill="#242427"/>';
 if(S.scene==='bedroom'||S.sleeping)return `<defs><pattern id="net" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 0L12 12M12 0L0 12" stroke="#e6dcf7" stroke-width="1"/></pattern></defs><rect width="400" height="500" fill="#b99b6c"/><rect y="420" width="400" height="80" fill="#8b6b45"/><path d="M90 0Q200 90 310 0Z" fill="#a98bd6"/><path d="M90 0Q200 90 310 0Z" fill="url(#net)"/><path d="M90 0L70 60M310 0L330 60" stroke="#8a6cb8" stroke-width="2" fill="none"/><rect x="96" y="388" width="12" height="36" fill="#4a2b12"/><rect x="300" y="388" width="12" height="36" fill="#4a2b12"/><rect x="92" y="372" width="224" height="10" fill="#5e3718"/><rect x="62" y="250" width="16" height="182" fill="#7a4a24"/><rect x="58" y="244" width="24" height="10" rx="3" fill="#5e3718"/><rect x="62" y="285" width="30" height="75" fill="#6b3f1f"/><rect x="320" y="330" width="16" height="102" fill="#7a4a24"/><rect x="316" y="324" width="24" height="9" rx="3" fill="#5e3718"/><rect x="324" y="346" width="14" height="30" fill="#6b3f1f"/><rect x="76" y="386" width="258" height="10" fill="#7a4a24"/><rect x="76" y="396" width="258" height="4" fill="#5e3718"/><rect x="76" y="346" width="258" height="42" rx="3" fill="#2a9aa8"/><rect x="76" y="338" width="258" height="14" rx="3" fill="#35b0bf"/><ellipse cx="128" cy="334" rx="32" ry="9" fill="#8fc7c9"/>`+(S.sleeping?`<g fill="#fff" font-family="sans-serif" font-weight="700" opacity=".9"><text x="150" y="262" font-size="16">Z</text><text x="168" y="240" font-size="22">Z</text><text x="192" y="210" font-size="28">Z</text></g>`:'');
 if(S.scene==='field')return `<defs><linearGradient id="sk2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ec5ea"/><stop offset="1" stop-color="#f6efc9"/></linearGradient></defs><rect width="400" height="500" fill="url(#sk2)"/><circle cx="320" cy="90" r="30" fill="#ffd95a"/><ellipse cx="80" cy="120" rx="46" ry="12" fill="#fff" opacity=".8"/><ellipse cx="250" cy="70" rx="40" ry="10" fill="#fff" opacity=".8"/><g fill="#3f7a3a"><ellipse cx="60" cy="330" rx="50" ry="26"/><ellipse cx="330" cy="332" rx="56" ry="28"/></g><rect y="335" width="400" height="165" fill="#8fbf4a"/><path d="M0 365H400M0 395H400M0 425H400M0 455H400M0 485H400" stroke="#6fa03a" stroke-width="4"/>`;
 if(S.scene==='pond')return `<defs><linearGradient id="sk3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bcd9ea"/><stop offset="1" stop-color="#eef2dc"/></linearGradient></defs><rect width="400" height="500" fill="url(#sk3)"/><g fill="#3f7a3a"><ellipse cx="50" cy="330" rx="60" ry="30"/><ellipse cx="350" cy="335" rx="64" ry="32"/></g><rect y="340" width="400" height="60" fill="#79b3c9"/><path d="M20 360H120M200 372H320M60 385H160" stroke="#a9d2e2" stroke-width="3"/><ellipse cx="300" cy="380" rx="16" ry="5" fill="#4f8a4a"/><ellipse cx="90" cy="370" rx="14" ry="4" fill="#4f8a4a"/><rect y="395" width="400" height="105" fill="#6f9f4c"/><path d="M175 395H225L310 500H110Z" fill="#b79866"/>`;
 if(S.scene==='room')return `<rect width="400" height="500" fill="#e9d9bd"/><rect y="400" width="400" height="100" fill="#a8825a"/><rect x="230" y="110" width="110" height="140" fill="#bfe3f2" stroke="#6b4a2f" stroke-width="8"/><path d="M285 110V250M230 180H340" stroke="#6b4a2f" stroke-width="5"/><rect x="50" y="140" width="70" height="90" fill="#d9a441" opacity=".55"/><ellipse cx="200" cy="468" rx="130" ry="18" fill="#c0543a"/>`;
 if(S.scene!=='village'&&S.scene!=='night')return '';
 const hut=(x,y,k)=>`<g transform="translate(${x} ${y}) scale(${k})"><rect x="-40" y="-30" width="80" height="50" fill="#b98f6a"/><path d="M-56 -24L0 -80L56 -24Z" fill="#c9a24b"/><path d="M-56 -24H56" stroke="#8f6f2a" stroke-width="3"/><rect x="-9" y="-6" width="18" height="26" fill="#4a3426"/></g>`;
 const tree=(x,y,k)=>`<g transform="translate(${x} ${y}) scale(${k})"><rect x="-6" y="-10" width="12" height="70" fill="#6b4a2f"/><circle cx="0" cy="-30" r="38" fill="#3f7a3a"/><circle cx="-28" cy="-10" r="26" fill="#4a8a42"/><circle cx="28" cy="-12" r="28" fill="#356b34"/></g>`;
 const ban=x=>`<g transform="translate(${x} 410)" fill="#5f9a3e"><ellipse cx="-16" cy="-30" rx="9" ry="34" transform="rotate(-35)"/><ellipse cx="16" cy="-30" rx="9" ry="34" transform="rotate(35)"/><ellipse cx="0" cy="-36" rx="9" ry="38"/></g>`;
 return `<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bcd9ea"/><stop offset="1" stop-color="#eef2dc"/></linearGradient></defs><rect width="400" height="500" fill="url(#sky)"/>${tree(350,330,.8)}${tree(40,320,.9)}${hut(320,400,1)}${hut(100,395,.7)}<rect y="395" width="400" height="105" fill="#6f9f4c"/><path d="M175 395H225L310 500H110Z" fill="#b79866"/>${ban(375)}${ban(25)}<ellipse cx="262" cy="484" rx="34" ry="6" fill="#9ec3d6" opacity=".7"/><rect x="26" y="446" width="84" height="12" rx="3" fill="#8a8a86"/><rect x="62" y="350" width="11" height="96" fill="#2f2f2f"/><path d="M58 348L30 362L34 368L68 356Z" fill="#2f2f2f"/><rect x="72" y="372" width="16" height="5" fill="#2f2f2f"/>`+(S.scene==='night'?`<rect width="400" height="500" fill="#0b1240" opacity=".6"/><circle cx="310" cy="70" r="24" fill="#fff6c8"/><circle cx="60" cy="50" r="2" fill="#fff"/><circle cx="140" cy="90" r="1.6" fill="#fff"/><circle cx="220" cy="40" r="2" fill="#fff"/><circle cx="260" cy="110" r="1.5" fill="#fff"/><circle cx="360" cy="140" r="1.8" fill="#fff"/>`:'');
}
function build(){
 const s=S,tw={slim:60,normal:72,chunky:92}[s.build],hw=tw/2,sk=s.skin,skd=dk(sk,.15),sh=s.shirt,shd=dk(sh,.2),pn=s.pants,el=s.age==='elder',hr=el?'#dcdcdc':s.hair,hrd=dk(hr,.25),ou=s.outfit,lx=14;
 const ph=ou==='shirt'?(s.age==='child'?72:124):ou==='kameez'?124:0,chk='<pattern id="chk" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M0 0H14M0 0V14" stroke="rgba(255,255,255,.35)" stroke-width="3"/></pattern>';
 const bigP=s.hat==='pallu'&&ou==='saree',K=s.toon?1.28:1,YY=y=>205+(y-205)*K;
 const kk=bigP?.8:K,hh=y=>205+(y-205)*kk,bw=40*kk+8,BH=s.style==='waist-length'?`<path d="M${200-bw} ${hh(150)}C${200-bw-4} ${hh(100)} ${200-bw*.6} ${hh(92)} 200 ${hh(92)}C${200+bw*.6} ${hh(92)} ${200+bw+4} ${hh(100)} ${200+bw} ${hh(150)}C${200+bw+6} 230 ${200+bw+8} 300 ${200+bw-2} 340Q200 354 ${200-bw+2} 340C${200-bw-8} 300 ${200-bw-6} 230 ${200-bw} ${hh(150)}Z" fill="${hr}"/>`:'';
const RT='<g transform="translate(200 226) scale(.72) translate(-340 -232)">',FD=dk(sh,.25);
 const REFLOW=`${RT}<path d="M306 298L374 298C384 390 400 470 418 536L262 536C280 470 296 400 306 298Z" fill="${sh}" stroke="#3B2A20" stroke-width="2.5" stroke-linejoin="round"/><path d="M298 340L280 520M382 340L400 520M330 330L322 530M352 330L360 530" fill="none" stroke="${FD}" stroke-width="2" opacity=".7" class="nl"/><path d="M296 150C298 178 306 198 316 215L324 246L386 246L384 150Z" fill="${sh}" class="nl"/><path d="M330 214C328 228 328 238 330 246M352 212C354 226 356 238 356 246M372 190C374 210 376 228 376 246" fill="none" stroke="${FD}" stroke-width="1.6" opacity=".6" class="nl"/><rect x="330" y="184" width="20" height="54" rx="8" fill="${skd}" stroke="#3B2A20" stroke-width="2.5"/><ellipse cx="340" cy="238" rx="14" ry="9" fill="${sk}" class="nl"/><path d="M304 232C314 226 324 224 330 224C336 240 344 240 350 224C356 224 366 226 376 232C380 260 380 280 376 298L304 298C300 280 300 260 304 232Z" fill="${s.blouse}" stroke="#3B2A20" stroke-width="2.5" stroke-linejoin="round"/></g>`;
 const REFPALLU=`${RT}<path fill-rule="evenodd" fill="${sh}" stroke="#3B2A20" stroke-width="2.5" stroke-linejoin="miter" stroke-miterlimit="6" d="M340 54C374 54 400 90 394 150C392 175 396 200 400 230C404 270 406 310 402 360C400 400 398 430 396 452C365 420 330 380 296 340C280 300 262 270 268 240C272 225 282 212 286 200C290 188 292 175 288 160C282 100 306 54 340 54ZM382 150C384 104 364 80 340 78C316 80 296 104 298 150C300 175 306 195 316 215C338 224 362 234 380 250C382 230 380 205 384 185C385 170 382 160 382 150Z"/><path d="M290 252C304 296 334 340 366 392M316 236C332 282 358 330 384 380M278 262C286 296 306 330 326 362M300 232C306 262 322 300 346 336M394 170C396 210 400 250 400 300C400 340 398 390 394 430" fill="none" stroke="${FD}" stroke-width="1.6" opacity=".6" class="nl"/></g>`;
 let o=`<defs>${chk}</defs>${scene()}<ellipse id="shadow" cx="200" cy="472" rx="60" ry="9" fill="rgba(0,0,0,.18)"/><g id="all">${still()?`<clipPath id="sc"><rect x="0" y="0" width="400" height="${isMat()?404:408}"/></clipPath><g clip-path="url(#sc)">`:''}<g transform="${s.sleeping?`translate(200 ${s.age==='child'?319:307}) rotate(-90) scale(${s.age==='child'?.5:.6}) translate(-200 -268)`:`${isSit()?`translate(0 ${s.age==='child'?54:78}) `:isMat()?`translate(0 ${s.age==='child'?55:80}) `:''}translate(200 460) scale(${s.age==='child'?.82:1}) translate(-200 -460)`}">${BH}`;
 [-1,1].forEach((d,i)=>{const x=200+d*lx;o+=`<g id="leg${i}" data-px="${x}" data-py="325"><rect x="${x-11}" y="320" width="22" height="130" rx="10" fill="${sk}"/>${ph?`<rect x="${x-12}" y="318" width="24" height="${ph}" rx="10" fill="${pn}"/>`:''}${s.sandals?`<ellipse cx="${x+d*2}" cy="458" rx="19" ry="6" fill="#6b4a2f"/>`:''}<ellipse cx="${x+d*2}" cy="452" rx="17" ry="8" fill="${skd}"/>${s.sandals?`<path d="M${x+d*2-13} 453Q${x+d*2} 441 ${x+d*2+13} 453" stroke="#3b2616" stroke-width="4" fill="none" class="nl"/>`:''}</g>`});
 const lg=`M${200-hw-2} 316H${200+hw+2}L${200+hw+12} 428H${200-hw-12}Z`;
 if(ou==='lungi'||ou==='fatua')o+=`<path d="${lg}" fill="${pn}"/><path d="${lg}" fill="url(#chk)"/>`;
 if(ou==='saree'&&!bigP)o+=`<path d="M${200-hw} 262H${200+hw}L${200+hw+26} 446H${200-hw-26}Z" fill="${sh}"/><path d="M190 330V436M200 330V436M210 330V436" stroke="${dk(sh,.25)}" stroke-width="2" opacity=".6" class="nl"/>`;
 if(bigP)o+=REFLOW;
 if(!bigP)o+=`<rect x="190" y="190" width="20" height="36" fill="${skd}"/>`;
 if(ou==='saree'&&!bigP)o+=`<rect x="${200-hw}" y="226" width="${tw}" height="70" rx="14" fill="${s.blouse}"/>${bigP?'':`<path d="M${200+hw+2} 226H${200+hw-26}L${200-hw+2} 346H${200-hw+30}Z" fill="${sh}"/>`}`;
 else if(bigP){}
 else if(ou==='kameez')o+=`<path d="M${200-hw} 226h${tw}L${200+hw+8} 366H${200-hw-8}Z" fill="${sh}"/><path d="M${200-hw+2} 230L${200+hw-2} 304L${200+hw+4} 292L${200-hw+10} 224Z" fill="${pn}" opacity=".9"/><path d="M${200-hw} 228q-9 60-5 120h13q-3-60 6-120Z" fill="${pn}"/>`;
 else if(ou==='fatua')o+=`<path d="M${200-hw} 226h${tw}L${200+hw+6} 350H${200-hw-6}Z" fill="${sh}"/><path d="M200 232V300" stroke="${shd}" stroke-width="2"/>`;
 else o+=`<rect x="${200-hw}" y="226" width="${tw}" height="100" rx="14" fill="${sh}"/><path d="M200 232V320" stroke="${shd}" stroke-width="2"/>`;
 if(!bigP)o+=`<path d="M190 226L200 242L210 226Z" fill="${skd}"/>`;
 if(s.necklace)o+=`<path d="M189 214Q200 232 211 214" fill="none" stroke="#e0b030" stroke-width="2.5" stroke-linecap="round" class="nl"/><circle cx="200" cy="225" r="3.6" fill="#e0b030" stroke="#8a6a10" stroke-width="1" class="nl"/>`;

 const SL={shirt:42,kameez:84,fatua:84,lungi:42,saree:34}[ou];
