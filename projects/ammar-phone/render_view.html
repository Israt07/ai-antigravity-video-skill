<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Village 2D Scene Player</title>
<style>
  /* Ensure Bengali font is loaded for SVG rendering */
  @font-face {
    font-family: 'NirmalaUI';
    src: local('Nirmala UI'), local('NirmalaUI'), local('Nirmala UI Bold');
    font-weight: 100 900;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #FAF5EB;
    font-family: 'Nirmala UI', 'Kalpurush', 'Inter', system-ui, sans-serif;
  }
  #cv {
    display: block;
    width: 1080px;
    height: 1920px;
  }
  #svg_container {
    display: none;
  }
  .ol path, .ol rect, .ol ellipse, .ol circle, .ol polygon {
    stroke: #2B1B1B;
    stroke-width: 2.5;
    stroke-linejoin: round;
  }
  .ol .eye ellipse {
    stroke-width: 1.5;
  }
  .nl {
    stroke: none !important;
  }
</style>
</head>
<body>
<div id="svg_container"></div>
<canvas id="cv" width="1080" height="1920"></canvas>

<script type="module">
import { buildSceneSVG, animate } from './src/village2d/renderer.js';

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const container = document.getElementById('svg_container');

let currentScene = null;
let dur = 3.5;

window.initScene = (spec) => {
  currentScene = spec;
  dur = spec.duration || 3.5;
  container.innerHTML = buildSceneSVG({
    background: spec.background,
    characters: spec.characters,
    dialogue: spec.dialogue,
    t: 0,
    duration: dur
  });
  return dur;
};

window.OP = {
  ready: false,
  duration: () => dur,
  draw: (t) => {
    if (!currentScene) return Promise.resolve(cv.toDataURL('image/jpeg', 0.95));
    container.innerHTML = buildSceneSVG({
      background: currentScene.background,
      characters: currentScene.characters,
      dialogue: currentScene.dialogue,
      t: t,
      duration: dur
    });

    const stage = document.getElementById('stage');
    for (const c of currentScene.characters) {
      animate(c.id, t, c.anim || 'idle', stage);
    }

    const svgStr = new XMLSerializer().serializeToString(stage);
    const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        ctx.clearRect(0, 0, 1080, 1920);
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);
        resolve(cv.toDataURL('image/jpeg', 0.95));
      };
      img.src = url;
    });
  }
};

document.fonts.ready.then(() => {
  window.OP.ready = true;
});
</script>
</body>
</html>
